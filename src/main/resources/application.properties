spring.config.import=optional:file:.env[.properties]
spring.application.name=sistema_contabilidade
spring.profiles.default=local

app.logging.service-version=${APP_VERSION:0.0.1}
app.logging.event-dataset=${spring.application.name}.application

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.sistema_contabilidade.monitoring.query.QueryCountStatementInspector
app.database.routing.enabled=${APP_DB_ROUTING_ENABLED:false}
app.database.sticky-writer.seconds=${APP_DB_STICKY_SECONDS:10}
app.database.sticky-writer.valkey-enabled=${APP_DB_STICKY_VALKEY_ENABLED:${APP_RATE_LIMIT_VALKEY_ENABLED:false}}
app.database.sticky-writer.marker-cookie-name=${APP_DB_STICKY_MARKER_COOKIE_NAME:SC_DB_STICKY}
app.database.sticky-writer.marker-secret=${APP_DB_STICKY_MARKER_SECRET:${SESSION_CRYPTO_SECRET:}}
app.database.crypto-secret=${DB_COLUMN_CRYPTO_SECRET:${SESSION_CRYPTO_SECRET}}
app.database.crypto-backfill-enabled=${APP_DB_CRYPTO_BACKFILL_ENABLED:true}

app.session.cookie-name=SC_SESSION
app.session.ttl-minutes=${APP_SESSION_TTL_MINUTES:480}
app.session.crypto-secret=${SESSION_CRYPTO_SECRET}
app.admin.route-secret=${ADMIN_ROUTE_SECRET:${SESSION_CRYPTO_SECRET}}
app.admin.ip-allowlist=${ADMIN_IP_ALLOWLIST:}
app.auth.provider=${APP_AUTH_PROVIDER:local}
app.auth.allow-local-in-prod=${APP_AUTH_ALLOW_LOCAL_IN_PROD:false}

app.jwt.ec-private-key=${JWT_EC_PRIVATE_KEY:}
app.jwt.ec-public-key=${JWT_EC_PUBLIC_KEY:}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:15}
app.security.argon2.salt-length=${APP_SECURITY_ARGON2_SALT_LENGTH:16}
app.security.argon2.hash-length=${APP_SECURITY_ARGON2_HASH_LENGTH:32}
app.security.argon2.parallelism=${APP_SECURITY_ARGON2_PARALLELISM:2}
app.security.argon2.memory-cost=${APP_SECURITY_ARGON2_MEMORY_COST:65536}
app.security.argon2.time-cost=${APP_SECURITY_ARGON2_TIME_COST:3}
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.rate-limit.max-requests=${APP_RATE_LIMIT_MAX_REQUESTS:120}
app.security.rate-limit.window-seconds=${APP_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.rate-limit.valkey-enabled=${APP_RATE_LIMIT_VALKEY_ENABLED:false}
app.relatorio.resumo-cache.enabled=${APP_RELATORIO_RESUMO_CACHE_ENABLED:false}
app.relatorio.resumo-cache.ttl-seconds=${APP_RELATORIO_RESUMO_CACHE_TTL_SECONDS:30}
app.relatorio.resumo-cache.max-bytes=${APP_RELATORIO_RESUMO_CACHE_MAX_BYTES:131072}
app.pdf.max-concurrency=${APP_PDF_MAX_CONCURRENCY:2}
app.pdf.queue-capacity=${APP_PDF_QUEUE_CAPACITY:4}
app.pdf.retry-after-seconds=${APP_PDF_RETRY_AFTER_SECONDS:5}
app.auth.login-diagnostics.enabled=false
app.default-admin.name=${DEFAULT_ADMIN_NAME:Administrador}
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@sistema.local}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}

aws.region=${AWS_REGION:}
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
aws.cognito.app-client-id=${COGNITO_APP_CLIENT_ID:}
aws.cognito.app-client-secret=${COGNITO_APP_CLIENT_SECRET:}
aws.cognito.group-prefix=${COGNITO_GROUP_PREFIX:}
aws.cognito.username-attribute=${COGNITO_USERNAME_ATTRIBUTE:email}

app.query-monitor.enabled=${APP_QUERY_MONITOR_ENABLED:true}
app.query-monitor.threshold=${APP_QUERY_MONITOR_THRESHOLD:15}
app.query-monitor.add-response-header=${APP_QUERY_MONITOR_ADD_RESPONSE_HEADER:true}
app.request-timing.enabled=${APP_REQUEST_TIMING_ENABLED:true}
app.request-timing.add-response-headers=${APP_REQUEST_TIMING_ADD_RESPONSE_HEADERS:true}
app.request-timing.log-threshold-ms=${APP_REQUEST_TIMING_LOG_THRESHOLD_MS:750}
app.memory-monitor.enabled=${APP_MEMORY_MONITOR_ENABLED:true}
app.memory-monitor.scheduled-logging-enabled=${APP_MEMORY_MONITOR_SCHEDULED_LOGGING_ENABLED:false}
app.memory-monitor.fixed-delay-ms=${APP_MEMORY_MONITOR_FIXED_DELAY_MS:60000}
app.memory-monitor.heap-alert-threshold=${APP_MEMORY_MONITOR_HEAP_ALERT_THRESHOLD:0.70}
app.memory-monitor.metaspace-alert-threshold=${APP_MEMORY_MONITOR_METASPACE_ALERT_THRESHOLD:0.80}
app.memory-monitor.container-alert-threshold=${APP_MEMORY_MONITOR_CONTAINER_ALERT_THRESHOLD:0.70}
app.memory-monitor.container-critical-threshold=${APP_MEMORY_MONITOR_CONTAINER_CRITICAL_THRESHOLD:0.80}
app.memory-monitor.max-heap-to-container-ratio=${APP_MEMORY_MAX_HEAP_TO_CONTAINER_RATIO:0.50}
app.memory-monitor.envelope-enforced=${APP_MEMORY_ENVELOPE_ENFORCED:false}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.group.alb.include=ping,writer
management.endpoint.health.group.alb.show-components=always
management.endpoint.health.group.alb.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.jvm.memory.used=true
spring.jmx.enabled=true

spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=64
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=8
spring.data.redis.lettuce.pool.max-wait=50ms

app.cache.caffeine.user-details.maximum-size=${APP_CACHE_CAFFEINE_USER_DETAILS_MAXIMUM_SIZE:500}
app.cache.caffeine.user-details.expire-after-write=${APP_CACHE_CAFFEINE_USER_DETAILS_EXPIRE_AFTER_WRITE:5m}
app.cache.caffeine.item-descricoes.maximum-size=${APP_CACHE_CAFFEINE_ITEM_DESCRICOES_MAXIMUM_SIZE:8}
app.cache.caffeine.item-descricoes.expire-after-write=${APP_CACHE_CAFFEINE_ITEM_DESCRICOES_EXPIRE_AFTER_WRITE:5m}
app.cache.caffeine.item-tipos-documento.maximum-size=${APP_CACHE_CAFFEINE_ITEM_TIPOS_DOCUMENTO_MAXIMUM_SIZE:8}
app.cache.caffeine.item-tipos-documento.expire-after-write=${APP_CACHE_CAFFEINE_ITEM_TIPOS_DOCUMENTO_EXPIRE_AFTER_WRITE:5m}
app.cache.caffeine.sticky-writer.maximum-size=${APP_CACHE_CAFFEINE_STICKY_WRITER_MAXIMUM_SIZE:100000}

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
