<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:attr="data-account-theme=${accountTheme}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuários</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <script src="/assets/js/theme-init-20260812-victor-campaign-1.js"></script>
    <link
      th:if="${accountTheme == 'victor-campaign'}"
      rel="stylesheet"
      href="/assets/css/account-theme-20260812-victor-campaign-1.css"
    />
    <link th:if="${accountTheme == 'victor-campaign'}" rel="preload" as="image" href="/assets/img/victor-campaign-redesign-dark-20260811-2.png" fetchpriority="high" />
    <link th:if="${accountTheme == 'victor-campaign'}" rel="preload" as="image" href="/assets/img/victor-campaign-redesign-light-20260811-2.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/usuarios-20260807-admin-directory-1.css" />
    <link rel="stylesheet" href="/assets/css/navbar-20260420-navbar-notification-count-fix-3.css" />
  </head>
  <body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <div class="bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="grid"></div>
    </div>

    <main class="page page-wide">
      <header class="page-header">
        <span class="chip">Admin</span>
        <h1>Usuários</h1>
        <p>Consulte os identificadores e emails cadastrados.</p>
      </header>

      <section class="card users-card" aria-labelledby="users-table-title">
        <div class="users-toolbar">
          <label class="search-field" for="users-search">
            <span>Buscar por ID ou email</span>
            <input
              id="users-search"
              type="search"
              placeholder="Digite para filtrar"
              autocomplete="off"
            />
          </label>
          <p id="users-count" class="users-count" aria-live="polite"></p>
        </div>

        <div class="table-wrap">
          <table>
            <caption id="users-table-title" class="sr-only">Usuários cadastrados</caption>
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Email</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>
        <p id="users-feedback" class="users-feedback" role="status" aria-live="polite"></p>
        <button id="users-retry" class="btn" type="button" hidden>Carregar novamente</button>
      </section>
    </main>

    <script src="/assets/js/navbar-20260502-startup-perf-1.js" defer></script>
    <script src="/assets/js/usuarios-20260807-admin-directory-1.js" defer></script>
  </body>
</html>
