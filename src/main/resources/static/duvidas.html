<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Dúvidas recebidas | SACS Contábil</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <script src="/assets/js/theme-init-20260812-victor-campaign-1.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/duvidas-20260727-admin-list-1.css" />
    <link rel="stylesheet" href="/assets/css/navbar-20260420-navbar-notification-count-fix-3.css" />
    <script src="/assets/js/auth-session-20260502-startup-perf-1.js"></script>
  </head>
  <body>
    <div id="navbar-root" data-navbar-root></div>

    <div class="page-background" aria-hidden="true">
      <span class="glow glow-left"></span>
      <span class="glow glow-right"></span>
      <span class="background-grid"></span>
    </div>

    <main class="questions-page">
      <header class="page-header">
        <div>
          <a class="back-link" href="/admin">← Painel administrativo</a>
          <span class="eyebrow">Atendimento</span>
          <h1>Dúvidas recebidas</h1>
          <p>Consulte as perguntas enviadas pela página pública e registre o andamento.</p>
        </div>
        <div class="total-card" aria-live="polite">
          <span id="total-label">Total encontrado</span>
          <strong id="total-count">—</strong>
        </div>
      </header>

      <section class="filters-card" aria-label="Filtros da consulta">
        <form id="question-filters" class="filters-form" role="search">
          <label class="search-field" for="question-search">
            <span>Buscar dúvida</span>
            <input
              id="question-search"
              name="termo"
              type="search"
              maxlength="120"
              autocomplete="off"
              placeholder="Nome, e-mail, protocolo ou texto"
            />
          </label>

          <label class="status-field" for="status-filter">
            <span>Situação</span>
            <select id="status-filter" name="status">
              <option value="">Todas</option>
              <option value="PENDENTE">Pendentes</option>
              <option value="RESPONDIDA">Respondidas</option>
            </select>
          </label>

          <button class="primary-button" type="submit">Buscar</button>
          <button id="clear-filters" class="secondary-button" type="button">Limpar</button>
        </form>
      </section>

      <div id="questions-feedback" class="feedback" role="status" aria-live="polite"></div>
      <section id="questions-list" class="questions-list" aria-label="Dúvidas encontradas"></section>

      <nav id="pagination" class="pagination" aria-label="Paginação" hidden>
        <button id="previous-page" class="pagination-button" type="button">← Anterior</button>
        <span id="page-summary"></span>
        <button id="next-page" class="pagination-button" type="button">Próxima →</button>
      </nav>
    </main>

    <template id="question-card-template">
      <article class="question-card">
        <header class="question-card-header">
          <div>
            <span class="question-status"></span>
            <h2 class="question-name"></h2>
          </div>
          <time class="question-date"></time>
        </header>
        <p class="question-message"></p>
        <dl class="question-meta">
          <div>
            <dt>E-mail</dt>
            <dd><a class="question-email"></a></dd>
          </div>
          <div>
            <dt>Protocolo</dt>
            <dd class="protocol-row">
              <code class="question-protocol"></code>
              <button class="copy-button" type="button">Copiar</button>
            </dd>
          </div>
        </dl>
        <footer class="question-actions">
          <label>
            <span>Atualizar situação</span>
            <select class="question-status-select">
              <option value="PENDENTE">Pendente</option>
              <option value="RESPONDIDA">Respondida</option>
            </select>
          </label>
        </footer>
      </article>
    </template>

    <script src="/assets/js/navbar-20260502-startup-perf-1.js" defer></script>
    <script src="/assets/js/duvidas-20260727-admin-list-1.js" defer></script>
  </body>
</html>
