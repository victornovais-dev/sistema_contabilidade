<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relatorios</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <script src="/assets/js/theme-init-20260414-notificacoes-1.js"></script>
    <script src="assets/js/auth-session-20260502-startup-perf-1.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/relatorios-20260731-pdf-capacity-1.css" />
    <link rel="stylesheet" href="assets/css/navbar-20260420-navbar-notification-count-fix-3.css" />
  </head>
  <body>
    <div id="navbar-root" data-navbar-root></div>

    <div class="bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="grid"></div>
    </div>

    <main class="page page-wide">
      <header class="page-header">
        <span class="chip">Relatorio</span>
        <div class="report-header-row">
          <h1>Relatorios</h1>
          <div class="role-filter-box" id="role-filter-box" hidden>
            <label for="role-filter-select">Candidato</label>
            <div class="custom-select" data-custom-select>
              <button
                class="custom-select-trigger"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                Selecione
              </button>
              <div class="custom-select-menu" role="listbox" hidden></div>
              <select
                id="role-filter-select"
                class="native-select"
                aria-label="Filtrar por candidato"
                aria-hidden="true"
              >
                <option value="" disabled selected>Selecione</option>
              </select>
            </div>
          </div>
        </div>
      </header>

      <section id="report-state" class="card report-state">Carregando relatórios...</section>

      <section class="summary-layout" id="summary-layout" hidden>
        <section class="card summary-card summary-card-overview" id="summary-overview-card" hidden>
          <div class="summary-card-title">Receitas</div>
        </section>
        <section class="card summary-card summary-card-solo" id="summary-contas-card" hidden>
          <div class="summary-card-title">Saldo das contas</div>
        </section>
        <section class="card summary-card summary-card-solo" id="summary-despesas-card" hidden>
          <div class="summary-card-title">Despesas Executadas</div>
        </section>
        <section class="card summary-card summary-card-solo" id="summary-financeiro-card" hidden>
          <div class="summary-card-title">Resumo Financeiro</div>
        </section>
        <section class="card summary-card summary-card-solo" id="summary-limites-card" hidden>
          <div class="summary-card-title">Limites de gastos</div>
        </section>
      </section>

      <template id="summary-item-template">
        <div class="summary-item">
          <p class="summary-label" data-field="label"></p>
          <h2 class="summary-value" data-field="value"></h2>
        </div>
      </template>

      <section
        id="pdf-capacity-card"
        class="card pdf-capacity-card"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <div class="pdf-capacity-countdown" aria-label="Tempo restante">
          <span id="pdf-capacity-countdown">5</span><small>s</small>
        </div>
        <div>
          <strong>Gerador de PDF ocupado</strong>
          <p id="pdf-capacity-message">
            Todas as vagas estão em uso. Tente novamente quando o contador terminar.
          </p>
        </div>
      </section>

      <section class="report-actions">
        <button
          class="btn btn-primary"
          id="download-report-btn"
          type="button"
          aria-describedby="pdf-capacity-message"
        >
          Baixar relatorio (PDF)
        </button>
      </section>
    </main>

    <script src="assets/js/navbar-20260502-startup-perf-1.js" defer></script>
    <script src="assets/js/role-dropdown-20260420-home-role-filter-1.js" defer></script>
    <script src="assets/js/relatorios-20260731-pdf-capacity-1.js" defer></script>
  </body>
</html>
