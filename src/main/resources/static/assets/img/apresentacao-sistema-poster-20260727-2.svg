<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Apresentação da SACS Contábil</title>
  <desc id="desc">Fundo azul e laranja com a marca SACS Contábil e um botão para iniciar o vídeo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152e"/>
      <stop offset="0.55" stop-color="#0b315f"/>
      <stop offset="1" stop-color="#d84b34"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f0684a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f0684a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001126" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="1040" cy="110" r="360" fill="url(#glow)"/>
  <circle cx="160" cy="680" r="310" fill="url(#glow)" opacity=".48"/>
  <g fill="none" stroke="#fff" stroke-opacity=".07">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M0 600h1280"/>
    <path d="M160 0v720M320 0v720M480 0v720M640 0v720M800 0v720M960 0v720M1120 0v720"/>
  </g>
  <text x="640" y="248" text-anchor="middle" fill="#ffd2c1" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5">CONHEÇA O SISTEMA</text>
  <text x="640" y="337" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="64" font-weight="700">SACS Contábil</text>
  <text x="640" y="389" text-anchor="middle" fill="#c8d8e9" font-family="Arial, sans-serif" font-size="25">Do comprovante ao relatório, tudo em um só lugar.</text>
  <g filter="url(#shadow)">
    <circle cx="640" cy="506" r="54" fill="#e96e4f"/>
    <path d="M626 478l41 28-41 28z" fill="#fff"/>
  </g>
</svg>
