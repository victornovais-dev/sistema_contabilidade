logging.file.name=${LOG_DIR:/app/logs}/${spring.application.name}-${APP_ENV:prod}-${HOSTNAME:ec2}.json
app.logging.environment=${APP_ENV:prod}
app.auth.provider=${APP_AUTH_PROVIDER:cognito}

spring.datasource.url=${SPRING_DATASOURCE_URL:${SPRING_DATASOURCE_WRITER_URL}}
spring.datasource.username=${DB_USERNAME_PROD:${DB_USERNAME}}
spring.datasource.password=${DB_PASSWORD_PROD:${DB_PASSWORD}}

app.database.routing.enabled=${APP_DB_ROUTING_ENABLED:true}
app.database.writer.url=${SPRING_DATASOURCE_WRITER_URL:${SPRING_DATASOURCE_URL}}
app.database.writer.username=${DB_USERNAME_PROD:${DB_USERNAME}}
app.database.writer.password=${DB_PASSWORD_PROD:${DB_PASSWORD}}
app.database.writer.driver-class-name=com.mysql.cj.jdbc.Driver
app.database.writer.configuration.pool-name=WriterPool
app.database.writer.configuration.maximum-pool-size=${APP_DB_WRITER_MAX_POOL_SIZE:12}
app.database.writer.configuration.minimum-idle=${APP_DB_WRITER_MIN_IDLE:2}
app.database.writer.configuration.connection-timeout=${APP_DB_CONNECTION_TIMEOUT_MS:3000}
app.database.writer.configuration.validation-timeout=${APP_DB_VALIDATION_TIMEOUT_MS:1000}
app.database.writer.configuration.idle-timeout=${APP_DB_IDLE_TIMEOUT_MS:300000}
app.database.writer.configuration.max-lifetime=${APP_DB_MAX_LIFETIME_MS:600000}
app.database.writer.configuration.keepalive-time=${APP_DB_KEEPALIVE_TIME_MS:120000}
app.database.reader.url=${SPRING_DATASOURCE_READER_URL}
app.database.reader.username=${DB_USERNAME_PROD:${DB_USERNAME}}
app.database.reader.password=${DB_PASSWORD_PROD:${DB_PASSWORD}}
app.database.reader.driver-class-name=com.mysql.cj.jdbc.Driver
app.database.reader.configuration.pool-name=ReaderPool
app.database.reader.configuration.maximum-pool-size=${APP_DB_READER_MAX_POOL_SIZE:24}
app.database.reader.configuration.minimum-idle=${APP_DB_READER_MIN_IDLE:4}
app.database.reader.configuration.connection-timeout=${APP_DB_CONNECTION_TIMEOUT_MS:3000}
app.database.reader.configuration.validation-timeout=${APP_DB_VALIDATION_TIMEOUT_MS:1000}
app.database.reader.configuration.idle-timeout=${APP_DB_IDLE_TIMEOUT_MS:300000}
app.database.reader.configuration.max-lifetime=${APP_DB_MAX_LIFETIME_MS:600000}
app.database.reader.configuration.keepalive-time=${APP_DB_KEEPALIVE_TIME_MS:120000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial production schema
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:true}
spring.data.redis.connect-timeout=${APP_VALKEY_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${APP_VALKEY_COMMAND_TIMEOUT:1s}
spring.data.redis.lettuce.pool.max-active=${APP_VALKEY_POOL_MAX_ACTIVE:32}
spring.data.redis.lettuce.pool.max-idle=${APP_VALKEY_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${APP_VALKEY_POOL_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${APP_VALKEY_POOL_MAX_WAIT:100ms}
app.security.rate-limit.valkey-enabled=${APP_RATE_LIMIT_VALKEY_ENABLED:true}
app.relatorio.resumo-cache.enabled=${APP_RELATORIO_RESUMO_CACHE_ENABLED:true}

server.forward-headers-strategy=native

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

app.storage.type=${APP_STORAGE_TYPE:s3}
app.storage.max-pdf-size-bytes=${APP_STORAGE_MAX_PDF_SIZE_BYTES:20971520}
app.storage.s3.bucket=${APP_S3_BUCKET}
app.storage.s3.region=${APP_S3_REGION:us-east-1}
app.storage.s3.endpoint=${APP_S3_ENDPOINT:}
app.storage.s3.prefix=${APP_S3_PREFIX:itens}
